name: Build ZyNova APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZyNova-Launcher-arm64
          path: ZalithLauncher/build/outputs/apk/release/*.apk
          if-no-files-found: error
