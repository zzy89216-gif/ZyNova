name: Build ZyNova APK

# push 到 main 时的验证编译：出两个 APK（universal + arm64-v8a，均已代码混淆）。
on:
  push:
    # ⚠️ feat/sakurafrp 为临时验证分支，合并前必须移除
    branches: [ "main", "master", "feat/sakurafrp" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # GitHub API Token：只经 Secret / 环境变量注入，绝不写入源码、提交或 APK。
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK (universal + arm64)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZyNova-Launcher-apks
          path: ZalithLauncher/build/outputs/apk/**/release/**/*.apk
          if-no-files-found: error

      - name: Upload Mapping (obfuscation map)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZyNova-Launcher-mappings
          path: ZalithLauncher/build/outputs/mapping/**/mapping.txt
