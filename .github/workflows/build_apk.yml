name: Build ZyNova APK

# push 到 main 时的验证编译：只出一个通用版 APK（已代码混淆）。
#
# ⚠️ 只改文档的提交**不再**触发编译：每次编译约 19 分钟，改个错别字没必要等。
#    下面 paths-ignore 里的路径一旦是本次 push 的全部改动，这个工作流就不会启动。
#    真要手动跑一次：Actions → Build ZyNova APK → Run workflow（workflow_dispatch）。
#    发布时的编译不受影响，走的是 release_ci.yml → build.yml。
on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'LICENSE.*'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # GitHub API Token：只经 Secret / 环境变量注入，绝不写入源码、提交或 APK。
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK (universal only)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZyNova-Launcher-apks
          path: ZalithLauncher/build/outputs/apk/**/release/**/*.apk
          if-no-files-found: error

      - name: Upload Mapping (obfuscation map)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ZyNova-Launcher-mappings
          path: ZalithLauncher/build/outputs/mapping/**/mapping.txt
