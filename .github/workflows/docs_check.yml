name: Docs Check

# 文档一致性自检：版本号、六语种 README、CHANGELOG、HANDOFF、
# docs/zh↔docs/en 一对一、坏链、第三方声明副本、一次性表述。
# 只读检查，不产出产物，失败不影响构建，但会在 PR / 提交上显示红叉。

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check docs consistency
        run: python3 tools/check_docs.py
