name: Build APK

# 只发布**一个通用版本**（包含全部 4 个 ABI），不再按架构拆分。
# Release 构建保持代码混淆（见 ZalithLauncher/build.gradle.kts 的 buildTypes.release）。

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      GH_TOKEN:
        required: false
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      # GitHub API Token：只经 Secret / 环境变量注入，绝不写入源码、提交或 APK。
      # 未配置 GH_TOKEN Secret 时退回 Actions 内置 token。
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Build universal APK
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ inputs.variant }}

      - name: Upload Release APK (universal)
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release apk (universal)
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Upload Release Mapping (universal)
        if: inputs.variant == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (universal)
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      - name: Upload Debug APK (universal)
        if: inputs.variant == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug apk (universal)
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
